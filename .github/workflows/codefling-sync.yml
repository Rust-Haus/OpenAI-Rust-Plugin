# Sync Codefling description metadata.
# Note: This workflow updates description only (Edit endpoint).
# New .cs file releases must be done manually on Codefling (requires screenshots).

name: Codefling Sync

on:
  push:
    branches: [main]
    paths:
      - "codefling/description.html"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate description file
        run: |
          test -f codefling/description.html || { echo "::error::codefling/description.html missing"; exit 1; }
          echo "Description file present"

      - name: Update Codefling description
        env:
          CODEFLING_FILE_ID: ${{ secrets.CODEFLING_FILE_ID }}
          CODEFLING_CREATOR_API_KEY: ${{ secrets.CODEFLING_CREATOR_API_KEY }}
        run: |
          if [ -z "$CODEFLING_FILE_ID" ] || [ -z "$CODEFLING_CREATOR_API_KEY" ]; then
            echo "::error::Missing required secret: CODEFLING_FILE_ID or CODEFLING_CREATOR_API_KEY"
            exit 1
          fi
          
          DESCRIPTION=$(cat codefling/description.html)
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://codefling.com/api/downloads/files/${CODEFLING_FILE_ID}" \
            -H "Authorization: Bearer ${CODEFLING_CREATOR_API_KEY}" \
            --data-urlencode "category=2" \
            --data-urlencode "description=${DESCRIPTION}")
          
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Codefling API error (HTTP $HTTP_CODE): $HTTP_BODY"
            exit 1
          fi
          echo "Codefling description updated successfully (HTTP $HTTP_CODE)"
